version: 2

models:
  - name: stg_orders
    description: "Validated orders loaded by the Python pipeline."
    columns:
      - name: order_id
        description: "Unique identifier for an order."
        data_tests:
          - not_null
          - unique

      - name: status
        description: "Current status of the order."
        data_tests:
          - accepted_values:
              arguments:
                values: ['PAID', 'SHIPPED', 'CANCELLED', 'PENDING']

  - name: int_orders
    columns:
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id