name: Terraform CD

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    name: Plan dev infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"

      - name: Log in to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_PLAN_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_PLAN_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_PLAN_SUBSCRIPTION_ID }}

      - name: Verify Azure identity
        run: |
          az account show \
            --query "{Subscription:name,State:state,IdentityType:user.type}" \
            --output table

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Validate Terraform
        run: terraform validate -no-color

      - name: Plan Terraform changes
        run: terraform plan -input=false -no-color -lock-timeout=60s -out=tfplan

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v7
        with:
          name: terraform-plan
          path: infra/terraform/tfplan
          retention-days: 1
          if-no-files-found: error
