name: Terraform CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: test
        type: choice
        options:
          - test
          - dev

concurrency:
  group: terraform-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    name: Plan ${{ inputs.environment }} infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"

      - name: Log in to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_PLAN_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_PLAN_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_PLAN_SUBSCRIPTION_ID }}

      - name: Verify Azure identity
        run: |
          az account show \
            --query "{Subscription:name,State:state,IdentityType:user.type}" \
            --output table

      - name: Initialize Terraform
        run: terraform init -input=false -no-color -reconfigure -backend-config=backend-${{ inputs.environment }}.hcl

      - name: Validate Terraform
        run: terraform validate -no-color

      - name: Plan Terraform changes
        run: terraform plan -input=false -no-color -lock-timeout=60s -var-file=${{ inputs.environment }}.tfvars -out=tfplan

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v7
        with:
          name: terraform-plan-${{ inputs.environment }}
          path: infra/terraform/tfplan
          retention-days: 1
          if-no-files-found: error

  apply:
    name: Apply ${{ inputs.environment }} infrastructure
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.environment }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"

      - name: Download Terraform plan
        uses: actions/download-artifact@v8
        with:
          name: terraform-plan-${{ inputs.environment }}
          path: infra/terraform

      - name: Verify downloaded plan
        working-directory: infra/terraform
        run: test -f tfplan

      - name: Initialize Terraform
        working-directory: infra/terraform
        run: terraform init -input=false -no-color -reconfigure -backend-config=backend-${{ inputs.environment }}.hcl

      - name: Apply saved Terraform plan
        working-directory: infra/terraform
        run: terraform apply -input=false -no-color -lock-timeout=60s tfplan
