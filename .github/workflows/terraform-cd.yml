name: Terraform CD

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  gate:
    name: Verify Azure OIDC login
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: dev

    steps:
      - name: Log in to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure identity
        run: |
          az account show \
            --query "{Subscription:name,State:state,IdentityType:user.type}" \
            --output table
