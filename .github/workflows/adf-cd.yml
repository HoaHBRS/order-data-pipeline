name: ADF CD

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adf-cd-test
  cancel-in-progress: false

jobs:
  validate-files:
    name: Validate ADF deployment files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@v6

      - name: Checkout ADF publish artifacts
        uses: actions/checkout@v6
        with:
          ref: adf_publish
          path: adf-publish

      - name: Validate JSON files
        run: |
          python3 -m json.tool infra/adf/test.parameters.json >/dev/null
          python3 -m json.tool adf-publish/adf-order-pipeline-dev-080926/ARMTemplateForFactory.json >/dev/null

  deploy-test:
    name: Deploy ADF to TEST
    needs: validate-files
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    env:
      RESOURCE_GROUP: rg-order-data-pipeline-test
      TEMPLATE_FILE: adf-publish/adf-order-pipeline-dev-080926/ARMTemplateForFactory.json
      PARAMETERS_FILE: infra/adf/test.parameters.json

    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@v6

      - name: Checkout ADF publish artifacts
        uses: actions/checkout@v6
        with:
          ref: adf_publish
          path: adf-publish

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate ARM deployment
        run: |
          az deployment group validate \
            --resource-group "$RESOURCE_GROUP" \
            --template-file "$TEMPLATE_FILE" \
            --parameters "@$PARAMETERS_FILE" \
            --mode Incremental \
            --only-show-errors

      - name: Deploy ADF to TEST
        run: |
          az deployment group create \
            --name "adf-test-${GITHUB_RUN_NUMBER}" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file "$TEMPLATE_FILE" \
            --parameters "@$PARAMETERS_FILE" \
            --mode Incremental \
            --only-show-errors \
            --query properties.provisioningState \
            --output tsv